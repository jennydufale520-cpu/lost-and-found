{% extends 'base.html' %}

{% block content %}
<h1>📧 Contact Us</h1>
<p class="lead">Have questions or need help with an item? Send us a message.</p>
<hr>

<div class="row">
    <div class="col-md-5">
        <h5>Contact Information</h5>
        <p><strong>Email:</strong> support@lostfound.com</p>
        <p><strong>Phone:</strong> +63 917 123 4567</p>
        <p><strong>Location:</strong> College of Information Systems</p>
        <p><strong>Hours:</strong> Mon–Fri, 8:00 AM – 5:00 PM</p>
    </div>
    <div class="col-md-7">
        <form class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Your Name</label>
                <input type="text" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Subject</label>
                <select class="form-select">
                    <option>Inquiry about a found item</option>
                    <option>I lost something</option>
                    <option>General question</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div>
</div>
{% endblock %}
