{% extends 'base.html' %}

{% block content %}
<h1>📢 Report a Found Item</h1>
<p class="lead">Help someone find what they lost — fill in the details below.</p>
<hr>

<div class="row">
    <div class="col-md-8">
        <form class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">Item Name / Type</label>
                <input type="text" class="form-control" placeholder="e.g., Blue Wallet" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" rows="4" placeholder="Color, marks, unique features..." required></textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Date Found</label>
                    <input type="date" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Location Found</label>
                    <input type="text" class="form-control" placeholder="e.g., Room 204" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Your Contact Email</label>
                <input type="email" class="form-control" placeholder="So the owner can reach you" required>
            </div>
            <button type="submit" class="btn btn-success">Submit Report</button>
        </form>
    </div>
</div>
{% endblock %}
